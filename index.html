<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-title">
      <h1>タスク管理</h1>
      <div class="board-switcher">
        <select id="boardSelect" aria-label="ボードを選択"></select>
        <button type="button" id="addBoardBtn" class="icon-btn" title="ボードを追加" aria-label="ボードを追加">+</button>
        <button type="button" id="renameBoardBtn" class="icon-btn" title="ボード名を変更" aria-label="ボード名を変更">✎</button>
        <button type="button" id="deleteBoardBtn" class="icon-btn" title="ボードを削除" aria-label="ボードを削除">×</button>
      </div>
    </div>
    <div class="header-actions">
      <input type="search" id="searchInput" class="search-input" placeholder="🔍 検索..." aria-label="タスクを検索">
      <select id="filterCategory">
        <option value="">全カテゴリ</option>
      </select>
      <select id="filterPriority">
        <option value="">全優先度</option>
        <option value="high">高</option>
        <option value="mid">中</option>
        <option value="low">低</option>
      </select>
      <select id="sortSelect" aria-label="並び替え">
        <option value="manual">並び替え: 手動</option>
        <option value="due">並び替え: 期限順</option>
        <option value="priority">並び替え: 優先度順</option>
      </select>
      <button type="button" id="themeToggleBtn" class="btn-secondary"></button>
      <button type="button" id="notifyToggleBtn" class="btn-secondary"></button>
      <button id="exportBtn" class="btn-secondary">エクスポート</button>
      <button id="importBtn" class="btn-secondary">インポート</button>
      <input type="file" id="importFile" accept="application/json,.json" class="hidden">
      <button id="addTaskBtn" class="btn-primary">+ タスク追加</button>
    </div>
  </header>

  <div id="apiErrorBanner" class="api-error-banner hidden" role="alert">
    <span id="apiErrorMessage"></span>
    <button type="button" id="apiErrorDismiss" class="icon-btn" aria-label="閉じる">×</button>
  </div>

  <main class="board" id="board"></main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">タスク追加</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div id="taskCreatedAt" class="task-created hidden"></div>
        <label>タイトル<span class="required">*</span>
          <input type="text" id="taskTitle" required maxlength="100">
        </label>
        <label>詳細
          <textarea id="taskDesc" rows="3" maxlength="500"></textarea>
        </label>
        <label>ステータス
          <select id="taskStatus"></select>
        </label>
        <div class="form-row">
          <label>期限
            <input type="date" id="taskDue">
          </label>
          <label>優先度
            <select id="taskPriority">
              <option value="high">高</option>
              <option value="mid" selected>中</option>
              <option value="low">低</option>
            </select>
          </label>
        </div>
        <label>カテゴリ/タグ<span class="hint">(カンマ区切り)</span>
          <input type="text" id="taskCategory" placeholder="例: 仕事, 買い物">
        </label>
        <div class="checklist-section">
          <div class="checklist-header">
            <span>チェックリスト</span>
            <span class="checklist-progress" id="checklistProgress"></span>
          </div>
          <ul class="checklist-items" id="checklistItems"></ul>
          <div class="checklist-add">
            <input type="text" id="checklistNewItem" placeholder="項目を追加" maxlength="200">
            <button type="button" id="checklistAddBtn" class="btn-secondary">追加</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="deleteTaskBtn" class="btn-danger hidden">削除</button>
          <div class="modal-actions-right">
            <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
