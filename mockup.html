<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理 UIモックアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .mockup-banner {
    background: #172b4d;
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    padding: 8px 16px;
    letter-spacing: 0.02em;
  }
  .mockup-banner span { opacity: 0.75; font-weight: 500; }
</style>
</head>
<body>
  <div class="mockup-banner">UIモックアップ v1.2 <span>・ 操作はできません(見た目確認専用) ・ requirements.html と対で参照</span></div>

  <header class="app-header">
    <div class="header-title">
      <h1>タスク管理</h1>
      <div class="board-switcher">
        <select aria-label="ボードを選択">
          <option selected>マイボード</option>
          <option>仕事ボード</option>
        </select>
        <button type="button" class="icon-btn" title="ボードを追加" aria-label="ボードを追加">+</button>
        <button type="button" class="icon-btn" title="ボード名を変更" aria-label="ボード名を変更">✎</button>
        <button type="button" class="icon-btn" title="ボードを削除" aria-label="ボードを削除">×</button>
      </div>
    </div>
    <div class="header-actions">
      <input type="search" class="search-input" placeholder="🔍 検索..." aria-label="タスクを検索">
      <select>
        <option selected>全カテゴリ</option>
        <option>仕事</option>
        <option>会議</option>
        <option>資料</option>
        <option>デザイン</option>
        <option>保守</option>
      </select>
      <select>
        <option>全優先度</option>
        <option selected>高</option>
        <option>中</option>
        <option>低</option>
      </select>
      <select aria-label="並び替え">
        <option>並び替え: 手動</option>
        <option selected>並び替え: 期限順</option>
        <option>並び替え: 優先度順</option>
      </select>
      <button type="button" class="btn-secondary">🖥️ 自動</button>
      <button type="button" class="btn-secondary">🔕 期限通知OFF</button>
      <button class="btn-secondary">エクスポート</button>
      <button class="btn-secondary">インポート</button>
      <button class="btn-primary">+ タスク追加</button>
    </div>
  </header>

  <main class="board">

    <section class="column">
      <h2><span class="column-name">未着手</span><span class="count">2</span><button type="button" class="column-done-toggle" aria-pressed="false" title="この列を完了扱いにする(期限超過の表示を消す)">✓</button><button type="button" class="column-delete" aria-label="列を削除">×</button></h2>
      <div class="card-list">
        <div class="task-card">
          <div class="task-card-title">企画書のレビュー依頼</div>
          <div class="task-card-desc">各部署からのフィードバックを取りまとめる</div>
          <div class="task-meta">
            <span class="badge mid">中</span>
            <span class="badge due">09/25</span>
            <span class="tag azure">仕事</span>
            <span class="tag sky">会議</span>
          </div>
        </div>
        <div class="task-card">
          <div class="task-card-title">サーバー証明書の更新</div>
          <div class="task-meta">
            <span class="badge high">高</span>
            <span class="badge due overdue">09/10 (期限超過)</span>
            <span class="tag slate">保守</span>
          </div>
        </div>
      </div>
    </section>

    <section class="column">
      <h2><span class="column-name">進行中</span><span class="count">2</span><button type="button" class="column-done-toggle" aria-pressed="false" title="この列を完了扱いにする(期限超過の表示を消す)">✓</button><button type="button" class="column-delete" aria-label="列を削除">×</button></h2>
      <div class="card-list">
        <div class="task-card">
          <div class="task-card-title">月次レポート作成</div>
          <div class="task-meta">
            <span class="badge mid">中</span>
            <span class="badge checklist">✓ 2/4</span>
            <span class="tag azure">仕事</span>
            <span class="tag purple">資料</span>
          </div>
        </div>
        <div class="task-card">
          <div class="task-card-title">デザインカンプ確認</div>
          <div class="task-meta">
            <span class="badge low">低</span>
            <span class="badge due due-soon">09/19 (まもなく)</span>
            <span class="tag pink">デザイン</span>
          </div>
        </div>
      </div>
    </section>

    <section class="column">
      <h2><span class="column-name">レビュー中</span><span class="count">0</span><button type="button" class="column-done-toggle" aria-pressed="false" title="この列を完了扱いにする(期限超過の表示を消す)">✓</button><button type="button" class="column-delete" aria-label="列を削除">×</button></h2>
      <div class="card-list">
        <div class="empty-hint">タスクはありません</div>
      </div>
    </section>

    <section class="column">
      <h2><span class="column-name">完了</span><span class="count">1</span><button type="button" class="column-done-toggle active" aria-pressed="true" title="この列は完了扱いです(クリックで解除)">✓</button><button type="button" class="column-delete" aria-label="列を削除">×</button></h2>
      <div class="card-list">
        <div class="task-card">
          <div class="task-card-title">キックオフミーティング</div>
          <div class="task-meta">
            <span class="badge mid">中</span>
            <span class="badge checklist complete">✓ 3/3</span>
            <span class="tag sky">会議</span>
          </div>
        </div>
      </div>
    </section>

    <section class="column add-column">
      <button type="button" class="add-column-btn">+ 列を追加</button>
    </section>

  </main>

  <div class="modal-overlay">
    <div class="modal">
      <h2>タスク編集</h2>
      <form id="taskForm">
        <label>タイトル<span class="required">*</span>
          <input type="text" value="デザインカンプ確認提出" maxlength="100">
        </label>
        <label>詳細
          <textarea rows="3" maxlength="500">クライアントに提出する最終版を確認する</textarea>
        </label>
        <label>ステータス
          <select>
            <option>未着手</option>
            <option selected>進行中</option>
            <option>完了</option>
          </select>
        </label>
        <div class="form-row">
          <label>期限
            <input type="date" value="2026-09-19">
          </label>
          <label>優先度
            <select>
              <option>高</option>
              <option selected>中</option>
              <option>低</option>
            </select>
          </label>
        </div>
        <label>カテゴリ/タグ<span class="hint">(カンマ区切り)</span>
          <input type="text" value="仕事, デザイン">
        </label>
        <div class="checklist-section">
          <div class="checklist-header">
            <span>チェックリスト</span>
            <span class="checklist-progress">1/2</span>
          </div>
          <ul class="checklist-items">
            <li class="checklist-item done">
              <input type="checkbox" class="checklist-check" checked>
              <span class="checklist-text">ラフ案を共有</span>
              <button type="button" class="checklist-remove" aria-label="削除">×</button>
            </li>
            <li class="checklist-item">
              <input type="checkbox" class="checklist-check">
              <span class="checklist-text">最終確認</span>
              <button type="button" class="checklist-remove" aria-label="削除">×</button>
            </li>
          </ul>
          <div class="checklist-add">
            <input type="text" placeholder="項目を追加" maxlength="200">
            <button type="button" class="btn-secondary">追加</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-danger">削除</button>
          <div class="modal-actions-right">
            <button type="button" class="btn-secondary">キャンセル</button>
            <button type="submit" class="btn-primary">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
